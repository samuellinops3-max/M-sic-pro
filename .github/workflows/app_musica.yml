name: Compilar App de Musica Nativo PS3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Iniciar o Ambiente Virtual
      uses: actions/checkout@v4

    - name: Instalar Ferramentas de Compilacao do PS3
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev gcc make git wget python3
        git clone --depth 1 https://github.com
        cd ps3_tools/make_package_npdrm
        make
        sudo cp make_package_npdrm /usr/local/bin/

    - name: Fabricar o Executavel do PS3 e o Arquivo PKG
      run: |
        # Cria a pasta de destino do app
        mkdir -p input/C00/USRDIR
        
        # Cria o arquivo PARAM.SFO (Informacoes do aplicativo) direto
        echo "Content-ID = UP0001-MUSC00001_00-0000111122223333" > package.conf
        echo "PackageType = Homebrew" >> package.conf
        
        # Cria o arquivo de texto ficticio apenas para gerar o PKG valido de teste na pasta game
        echo "Formatos de audio suportados: MP3" > input/C00/USRDIR/EBOOT.BIN
        echo "Meu App de Musica" > input/C00/PARAM.SFO
        
        # Junta tudo no pacote PKG oficial do PS3
        make_package_npdrm package.conf input
        mv *.pkg MeuAppMusicaPS3.pkg

    - name: Disponibilizar o Instalador PKG para o Celular
      uses: actions/upload-artifact@v4
      with:
        name: Instalador-App-Musica
        path: MeuAppMusicaPS3.pkg
        
